# Every Monday, refresh each artist's Spotify follower count in src/data/artists.json and
# commit the change. Netlify sees the commit on main and redeploys with the re-sorted lineup.
# Can also be run any time from the repo's Actions tab ("Run workflow").
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   SPOTIFY_CLIENT_ID and SPOTIFY_CLIENT_SECRET, from an app at developer.spotify.com
name: Update artist following

on:
  schedule:
    - cron: "0 15 * * 1" # Mondays at 15:00 UTC (8 or 9 am in Denver)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Spotify followers
        run: node scripts/update-followers.mjs
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add src/data/artists.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update artist Spotify followers"
            git push
          fi
